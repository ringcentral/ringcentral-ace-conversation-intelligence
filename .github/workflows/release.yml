name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, v1.1.0 or 1.1.0); reuse the same version to retry a failed release
        type: string
        required: true

concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Preserve release tooling
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-release-tools"
          cp scripts/plugin_repo.py scripts/release.py requirements-dev.txt .claude-code-version "$RUNNER_TEMP/plugin-release-tools/"
      - name: Install preparation dependencies
        run: python -m pip install -r "$RUNNER_TEMP/plugin-release-tools/requirements-dev.txt"
      - name: Prepare version and release notes
        id: prepare
        env:
          RC_RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python "$RUNNER_TEMP/plugin-release-tools/release.py" prepare --root "$GITHUB_WORKSPACE" --version "$RC_RELEASE_VERSION" --state "$RUNNER_TEMP/release-state.json"
          python - "$RUNNER_TEMP/release-state.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          print("tag=" + json.loads(Path(sys.argv[1]).read_text())["tag"])
          PY
      - name: Install pinned validators
        shell: bash
        run: |
          RC_CLAUDE_VERSION=$(cat "$RUNNER_TEMP/plugin-release-tools/.claude-code-version")
          [[ "$RC_CLAUDE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global "@anthropic-ai/claude-code@$RC_CLAUDE_VERSION"
      - name: Validate and build before publishing
        env:
          RC_RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        shell: bash
        run: |
          python "$RUNNER_TEMP/plugin-release-tools/plugin_repo.py" --root "$GITHUB_WORKSPACE" check --tag "$RC_RELEASE_TAG"
          claude plugin validate ./plugins/claude --strict
          claude plugin validate . --strict
          python "$RUNNER_TEMP/plugin-release-tools/plugin_repo.py" --root "$GITHUB_WORKSPACE" build
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          python "$RUNNER_TEMP/plugin-release-tools/release.py" publish --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/release-state.json"
